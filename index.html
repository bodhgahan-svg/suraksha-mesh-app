<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live Shield SOS</title>
    <style>
        body { background: #090d16; color: #f8fafc; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; }
        .sos-btn { background: linear-gradient(135deg, #ef4444, #991b1b); color: white; border: none; width: 220px; height: 220px; border-radius: 50%; font-size: 30px; font-weight: bold; box-shadow: 0 0 50px rgba(239, 68, 68, 0.8); cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); } 70% { transform: scale(1.05); box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .status { margin-top: 20px; font-size: 16px; color: #cbd5e1; max-width: 400px; line-height: 1.5; padding: 0 20px; }
        .alert-box { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 10px; padding: 15px; margin-top: 20px; display: none; font-size: 14px; text-align: left; width: 90%; max-width: 400px; }
        video { width: 100%; max-width: 300px; border-radius: 10px; margin-top: 15px; display: none; border: 2px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
        .voice-status { margin-top: 10px; font-size: 13px; color: #38bdf8; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <h1>🚨 ग्लोबल लाइव शील्ड</h1>
    <button class="sos-btn" onclick="triggerGlobalSOS()">SOS<br>बचाओ!</button>
    <div class="status" id="statusText">सिस्टम एक्टिव है। बटन दबाएं या "बचाओ" बोलें।</div>
    <div class="voice-status" id="voiceStatus">🎙️ वॉयस कमांड (Voice Trigger) चालू हो रहा है...</div>
    
    <video id="liveVideo" autoplay playsinline muted></video>
    <div class="alert-box" id="alertBox"></div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://suraksha-mesh-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let audioCtx = null;
        let sirenInterval = null;

        function playSiren() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (sirenInterval) return;

            let freq = 400;
            let goingUp = true;

            sirenInterval = setInterval(() => {
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);

                if (goingUp) {
                    freq += 60;
                    if (freq > 950) goingUp = false;
                } else {
                    freq -= 60;
                    if (freq < 400) goingUp = true;
                }
            }, 200);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
                const videoElement = document.getElementById('liveVideo');
                videoElement.srcObject = stream;
                videoElement.style.display = "block";
            } catch (err) {
                console.log("कैमरा एरर: " + err.message);
            }
        }

        function triggerGlobalSOS() {
            if (navigator.vibrate) navigator.vibrate([1000, 500, 1000, 500]);
            
            document.getElementById('statusText').innerText = "⚠️ इमरजेंसी पल्स भेजी जा रही है!";
            startCamera();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        
                        db.ref('alerts/current').set({
                            lat: lat,
                            lon: lon,
                            time: Date.now(),
                            message: "जान पर खतरा! सटीक लोकेशन ट्रेस हो गई है।"
                        });

                        let alertBox = document.getElementById('alertBox');
                        alertBox.style.display = 'block';
                        alertBox.innerHTML = `📍 <strong>सटीक लोकेशन लॉक!</strong><br>Lat: ${lat}, Lon: ${lon}<br><a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="color: #f87171; font-weight: bold;">🗺️ गूगल मैप्स पर देखें</a>`;
                        playSiren();
                    },
                    (error) => {
                        alert("लोकेशन नहीं मिल पाई: " + error.message);
                        playSiren();
                    },
                    { enableHighAccuracy: true }
                );
            }
        }

        // वॉयस कमांड लिस्नर (Voice Trigger Setup)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; // हिंदी और अंग्रेजी दोनों के लिए
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const speechText = event.results[event.results.length - 1][0].transcript.toLowerCase();
                document.getElementById('voiceStatus').innerText = `👂 सुना गया: "${speechText}"`;
                
                // अगर कोई "बचाओ", "help" या "मदद" बोलेगा तो तुरंत SOS चालू हो जाएगा
                if (speechText.includes('बचाओ') || speechText.includes('help') || speechText.includes('मदद') || speechText.includes('save me')) {
                    triggerGlobalSOS();
                }
            };

            recognition.onerror = (event) => {
                console.log("वॉयस एरर: " + event.error);
            };

            recognition.onend = () => {
                try { recognition.start(); } catch(e) {} // लगातार सुनने के लिए रीस्टार्ट करें
            };

            try {
                recognition.start();
                document.getElementById('voiceStatus').innerText = "🎙️ वॉयस रडार एक्टिव है ('बचाओ' बोलकर टेस्ट करें)...";
            } catch (e) {
                document.getElementById('voiceStatus').innerText = "⚠️ माइक की परमिशन दें।";
            }
        } else {
            document.getElementById('voiceStatus').innerText = "⚠️ यह ब्राउज़र वॉयस कमांड सपोर्ट नहीं करता।";
        }

        db.ref('alerts/current').on('value', (snapshot) => {
            let data = snapshot.val();
            if (data && (Date.now() - data.time < 30000)) {
                playSiren();
                let alertBox = document.getElementById('alertBox');
                alertBox.style.display = 'block';
                alertBox.innerHTML = `🚨 <strong>लाइव इमरजेंसी इनकमिंग अलर्ट!</strong><br>Lat: ${data.lat}, Lon: ${data.lon}<br><a href="https://maps.google.com/?q=${data.lat},${data.lon}" target="_blank" style="color: #f87171; font-weight: bold; font-size: 16px;">🗺️ सटीक गूगल मैप लोकेशन खोलें</a>`;
                document.getElementById('statusText').innerText = "⚠️ खतरे का सायरन बज रहा है!";
            }
        });
    </script>
</body>
</html>
