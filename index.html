<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live Shield SOS</title>
    <style>
        body { background: #090d16; color: #f8fafc; font-family: sans-serif; text-align: center; padding: 15px; margin: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; min-height: 100vh; }
        
        /* सबसे ऊपर दिखने वाला लोकेशन बैनर */
        .top-location-banner { background: #991b1b; color: white; width: 100%; max-width: 450px; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 16px; font-weight: bold; display: none; box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); text-align: center; border: 2px solid #f87171; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .sos-btn { background: linear-gradient(135deg, #ef4444, #991b1b); color: white; border: none; width: 200px; height: 200px; border-radius: 50%; font-size: 28px; font-weight: bold; box-shadow: 0 0 40px rgba(239, 68, 68, 0.8); cursor: pointer; animation: pulse 1.5s infinite; margin-top: 10px; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        .status { margin-top: 15px; font-size: 15px; color: #cbd5e1; max-width: 400px; line-height: 1.4; padding: 0 10px; }
        video { width: 100%; max-width: 300px; border-radius: 10px; margin-top: 15px; display: none; border: 2px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
        .voice-status { margin-top: 10px; font-size: 13px; color: #38bdf8; font-weight: bold; }
        .map-link { display: inline-block; margin-top: 10px; background: white; color: #991b1b; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 15px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- 🚨 सबसे ऊपर दिखने वाला सटीक लोकेशन बैनर -->
    <div id="topBanner" class="top-location-banner">
        ⚠️ खतरा! सटीक स्थान खोजा जा रहा है...
    </div>

    <h1>🚨 ग्लोबल वॉयस शील्ड</h1>
    <button class="sos-btn" onclick="triggerGlobalSOS()">SOS<br>बचाओ!</button>
    <div class="status" id="statusText">वॉयस रडार चालू है। सिर्फ "मुझे बचाओ" बोलें।</div>
    <div class="voice-status" id="voiceStatus">🎙️ सुनने के लिए तैयार...</div>
    
    <video id="liveVideo" autoplay playsinline muted></video>
    <div id="extraDetails" style="margin-top: 15px;"></div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://suraksha-mesh-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let audioCtx = null;
        let sirenInterval = null;

        function playSiren() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (sirenInterval) return;

            let freq = 400;
            let goingUp = true;

            sirenInterval = setInterval(() => {
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);

                if (goingUp) {
                    freq += 60;
                    if (freq > 950) goingUp = false;
                } else {
                    freq -= 60;
                    if (freq < 400) goingUp = true;
                }
            }, 200);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
                const videoElement = document.getElementById('liveVideo');
                videoElement.srcObject = stream;
                videoElement.style.display = "block";
            } catch (err) {
                console.log("कैमरा एरर: " + err.message);
            }
        }

        async function getExactLocationName(lat, lon, callback) {
            try {
                let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                    headers: { 'Accept-Language': 'hi' }
                });
                let data = await response.json();
                let exactAddress = data.display_name || "अज्ञात स्थान";
                callback(exactAddress);
            } catch (e) {
                callback("स्थान का नाम लोड नहीं हो पाया");
            }
        }

        let isTriggered = false;

        function triggerGlobalSOS() {
            if (isTriggered) return;
            isTriggered = true;

            if (navigator.vibrate) navigator.vibrate([1000, 500, 1000, 500, 1000]);
            
            document.getElementById('statusText').innerText = "⚠️ 'मुझे बचाओ' वॉयस डिटेक्ट! लोकेशन भेजी जा रही है...";
            startCamera();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        
                        getExactLocationName(lat, lon, (exactAddress) => {
                            // डेटाबेस पर भेजें ताकि दुनिया के हर कोने में खुले लिंक पर यह सबसे ऊपर दिखे
                            db.ref('alerts/current').set({
                                lat: lat,
                                lon: lon,
                                address: exactAddress,
                                time: Date.now(),
                                message: "गंभीर खतरा!"
                            });

                            showTopAlert(exactAddress, lat, lon);
                            playSiren();
                        });
                    },
                    (error) => {
                        alert("GPS लोकेशन नहीं मिल पाई: " + error.message);
                        playSiren();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        function showTopAlert(address, lat, lon) {
            let topBanner = document.getElementById('topBanner');
            topBanner.style.display = 'block';
            topBanner.innerHTML = `🚨 <strong>घटना स्थल (सबसे सटीक पता):</strong><br>${address}`;

            let extraDetails = document.getElementById('extraDetails');
            extraDetails.innerHTML = `<a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" class="map-link">🗺️ गूगल मैप पर तुरंत रास्ता खोलें</a>`;
            document.getElementById('statusText').innerText = "⚠️ खतरे का सायरन बज रहा है!";
        }

        // वॉयस रिकग्निशन
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                const speechText = event.results[event.results.length - 1][0].transcript.toLowerCase();
                document.getElementById('voiceStatus').innerText = `👂 सुना गया: "${speechText}"`;
                
                if (speechText.includes('मुझे बचाओ') || speechText.includes('बचाओ') || speechText.includes('help me') || speechText.includes('मदद करो')) {
                    triggerGlobalSOS();
                }
            };

            recognition.onend = () => {
                if (!isTriggered) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            try {
                recognition.start();
                document.getElementById('voiceStatus').innerText = "🎙️ वॉयस रडार चालू है... 'मुझे बचाओ' बोलें।";
            } catch (e) {}
        }

        // क्लाउड पर इनकमिंग अलर्ट चेक करना
        db.ref('alerts/current').on('value', (snapshot) => {
            let data = snapshot.val();
            if (data && (Date.now() - data.time < 40000)) {
                playSiren();
                showTopAlert(data.address || 'स्थान लोड हो रहा है...', data.lat, data.lon);
            }
        });
    </script>
</body>
</html>
